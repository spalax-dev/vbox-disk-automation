<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1109.375px" preserveAspectRatio="none" style="width:960px;height:1109px;background:#FFFFFF;" version="1.1" viewBox="0 0 960 1109" width="960.9375px" zoomAndPan="magnify"><defs/><g><ellipse cx="263.8704" cy="31.25" fill="#222222" rx="15.625" ry="15.625" style="stroke:#222222;stroke-width:1.5625;"/><rect fill="#F1F1F1" height="107.863" rx="9.375" ry="9.375" style="stroke:#181818;stroke-width:0.7813;" width="453.2405" x="37.2501" y="78.125"/><text fill="#000000" font-family="'Arimo'" font-size="18.75" lengthAdjust="spacing" textLength="395.5154" x="52.8751" y="113.7939">Recibir los par&#225;metros del disco, identificarlo</text><text fill="#000000" font-family="'Arimo'" font-size="18.75" lengthAdjust="spacing" textLength="421.9905" x="52.8751" y="139.3316">en el invitado por su etiqueta o por su tama&#241;o y</text><text fill="#000000" font-family="'Arimo'" font-size="18.75" lengthAdjust="spacing" textLength="381.3028" x="52.8751" y="164.8692">leer el estado real con lsblk, blkid y findmnt</text><rect fill="#F1F1F1" height="56.7877" rx="9.375" ry="9.375" style="stroke:#181818;stroke-width:0.7813;" width="436.1217" x="45.8096" y="294.5676"/><text fill="#000000" font-family="'Arimo'" font-size="18.75" lengthAdjust="spacing" textLength="404.8717" x="61.4346" y="330.2365">Crear una tabla GPT y una partici&#243;n con sfdisk</text><polygon fill="#F1F1F1" points="60.9991,217.238,466.7417,217.238,485.4917,235.988,466.7417,254.738,60.9991,254.738,42.2491,235.988,60.9991,217.238" style="stroke:#181818;stroke-width:0.7813;"/><text fill="#000000" font-family="'Arimo'" font-size="17.1875" lengthAdjust="spacing" textLength="12.6671" x="270.1204" y="273.1113">s&#237;</text><text fill="#000000" font-family="'Arimo'" font-size="17.1875" lengthAdjust="spacing" textLength="405.7425" x="60.9991" y="242.6567">&#191;el disco declarado carece de tabla de particiones?</text><text fill="#000000" font-family="'Arimo'" font-size="17.1875" lengthAdjust="spacing" textLength="21.0202" x="485.4917" y="230.9521">no</text><polygon fill="#F1F1F1" points="263.8704,382.6053,282.6204,401.3553,263.8704,420.1053,245.1204,401.3553,263.8704,382.6053" style="stroke:#181818;stroke-width:0.7813;"/><rect fill="#F1F1F1" height="56.7877" rx="9.375" ry="9.375" style="stroke:#181818;stroke-width:0.7813;" width="472.047" x="27.8469" y="528.6849"/><text fill="#000000" font-family="'Arimo'" font-size="18.75" lengthAdjust="spacing" textLength="440.797" x="43.4719" y="564.3538">Formatear con mkfs.ext4 o mkfs.xfs seg&#250;n fs_type</text><polygon fill="#F1F1F1" points="88.602,451.3553,439.1387,451.3553,457.8887,470.1053,439.1387,488.8553,88.602,488.8553,69.852,470.1053,88.602,451.3553" style="stroke:#181818;stroke-width:0.7813;"/><text fill="#000000" font-family="'Arimo'" font-size="17.1875" lengthAdjust="spacing" textLength="12.6671" x="270.1204" y="507.2286">s&#237;</text><text fill="#000000" font-family="'Arimo'" font-size="17.1875" lengthAdjust="spacing" textLength="350.5367" x="88.602" y="476.774">&#191;la partici&#243;n carece de sistema de archivos?</text><text fill="#000000" font-family="'Arimo'" font-size="17.1875" lengthAdjust="spacing" textLength="21.0202" x="457.8887" y="465.0694">no</text><polygon fill="#F1F1F1" points="263.8704,616.7226,282.6204,635.4726,263.8704,654.2226,245.1204,635.4726,263.8704,616.7226" style="stroke:#181818;stroke-width:0.7813;"/><rect fill="#F1F1F1" height="82.3254" rx="9.375" ry="9.375" style="stroke:#181818;stroke-width:0.7813;" width="459.1656" x="34.2876" y="762.8022"/><text fill="#000000" font-family="'Arimo'" font-size="18.75" lengthAdjust="spacing" textLength="427.9156" x="49.9126" y="798.4711">Crear el punto de montaje, a&#241;adir la entrada por</text><text fill="#000000" font-family="'Arimo'" font-size="18.75" lengthAdjust="spacing" textLength="299.6646" x="49.9126" y="824.0088">UUID en fstab y ejecutar mount -a</text><polygon fill="#F1F1F1" points="68.5959,685.4726,459.1448,685.4726,477.8948,704.2226,459.1448,722.9726,68.5959,722.9726,49.8459,704.2226,68.5959,685.4726" style="stroke:#181818;stroke-width:0.7813;"/><text fill="#000000" font-family="'Arimo'" font-size="17.1875" lengthAdjust="spacing" textLength="12.6671" x="270.1204" y="741.3459">s&#237;</text><text fill="#000000" font-family="'Arimo'" font-size="17.1875" lengthAdjust="spacing" textLength="390.5489" x="68.5959" y="710.8913">&#191;el montaje no est&#225; activo ni declarado en fstab?</text><text fill="#000000" font-family="'Arimo'" font-size="17.1875" lengthAdjust="spacing" textLength="21.0202" x="477.8948" y="699.1867">no</text><polygon fill="#F1F1F1" points="263.8704,876.3775,282.6204,895.1275,263.8704,913.8775,245.1204,895.1275,263.8704,876.3775" style="stroke:#181818;stroke-width:0.7813;"/><path d="M541.8033,950.8121 L541.8033,980.0402 L510.5533,986.2902 L541.8033,992.5402 L541.8033,1021.7684 A0,0 0 0 0 541.8033,1021.7684 L943.2473,1021.7684 A0,0 0 0 0 943.2473,1021.7684 L943.2473,966.4371 L927.6223,950.8121 L541.8033,950.8121 A0,0 0 0 0 541.8033,950.8121" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7813;"/><path d="M927.6223,950.8121 L927.6223,966.4371 L943.2473,966.4371 L927.6223,950.8121" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.7813;"/><text fill="#000000" font-family="'Arimo'" font-size="20.3125" lengthAdjust="spacing" textLength="368.6316" x="551.1783" y="980.3387">el disco del sistema nunca se identifica</text><text fill="#000000" font-family="'Arimo'" font-size="20.3125" lengthAdjust="spacing" textLength="358.7597" x="551.1783" y="1008.0043">como disco de datos ni se reformatea</text><rect fill="#F1F1F1" height="82.3254" rx="9.375" ry="9.375" style="stroke:#181818;stroke-width:0.7813;" width="493.3658" x="17.1875" y="945.1275"/><text fill="#000000" font-family="'Arimo'" font-size="18.75" lengthAdjust="spacing" textLength="462.1158" x="32.8125" y="980.7964">Devolver en pares clave=valor el dispositivo, la tabla,</text><text fill="#000000" font-family="'Arimo'" font-size="18.75" lengthAdjust="spacing" textLength="318.7148" x="32.8125" y="1006.3341">el fstype, el UUID, el montaje y fstab</text><ellipse cx="263.8704" cy="1075.8904" fill="none" rx="17.1875" ry="17.1875" style="stroke:#222222;stroke-width:1.5625;"/><ellipse cx="263.8704" cy="1075.8904" fill="#222222" rx="9.375" ry="9.375" style="stroke:#222222;stroke-width:1.5625;"/><line style="stroke:#181818;stroke-width:1.5625;" x1="263.8704" x2="263.8704" y1="46.875" y2="78.125"/><polygon fill="#181818" points="257.6204,62.5,263.8704,78.125,270.1204,62.5,263.8704,68.75" style="stroke:#181818;stroke-width:1.5625;"/><line style="stroke:#181818;stroke-width:1.5625;" x1="263.8704" x2="263.8704" y1="254.738" y2="294.5676"/><polygon fill="#181818" points="257.6204,278.9426,263.8704,294.5676,270.1204,278.9426,263.8704,285.1926" style="stroke:#181818;stroke-width:1.5625;"/><line style="stroke:#181818;stroke-width:1.5625;" x1="485.4917" x2="504.2417" y1="235.988" y2="235.988"/><polygon fill="#181818" points="497.9917,307.3365,504.2417,322.9615,510.4917,307.3365,504.2417,313.5865" style="stroke:#181818;stroke-width:1.5625;"/><line style="stroke:#181818;stroke-width:1.5625;" x1="504.2417" x2="504.2417" y1="235.988" y2="401.3553"/><line style="stroke:#181818;stroke-width:1.5625;" x1="504.2417" x2="282.6204" y1="401.3553" y2="401.3553"/><polygon fill="#181818" points="298.2454,395.1053,282.6204,401.3553,298.2454,407.6053,291.9954,401.3553" style="stroke:#181818;stroke-width:1.5625;"/><line style="stroke:#181818;stroke-width:1.5625;" x1="263.8704" x2="263.8704" y1="351.3553" y2="382.6053"/><polygon fill="#181818" points="257.6204,366.9803,263.8704,382.6053,270.1204,366.9803,263.8704,373.2303" style="stroke:#181818;stroke-width:1.5625;"/><line style="stroke:#181818;stroke-width:1.5625;" x1="263.8704" x2="263.8704" y1="185.988" y2="217.238"/><polygon fill="#181818" 