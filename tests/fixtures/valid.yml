VM1:
  vm_user: debian
  vm_pass: "secreto"
  disks:
    disk1:
      size: 4g
      fs_type: ext4
      mount_point: /mnt/datos
      label: datos-vm1
      file: /no/existe/VM1-disk1.vdi
    disk2:
      size: 1024
      fs_type: ext4
      mount_point: /mnt/respaldo
      label: respaldo-vm1
      file: /no/existe/VM1-disk2.vdi

VM2:
  vm_user: debian
  vm_pass_file: /etc/hostname
  disks:
    disk1:
      size: 3g
      fs_type: xfs
      mount_point: /srv/datos
      label: datos-vm2
      file: /no/existe/VM2-disk1.vdi
